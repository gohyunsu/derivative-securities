<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" role="img" aria-labelledby="t d">
<title id="t">선도와 콜옵션 매수자의 만기 payoff</title><desc id="d">행사가격 K에서 선도 payoff가 0이 된다. 콜 payoff는 K 이하에서 0이고 K 위에서는 선도 payoff와 정확히 겹친다. 옵션 프리미엄은 제외했다.</desc>
<rect width="660" height="350" rx="12" fill="#ffffff"/>
<path d="M70 34V285M70 190H610" fill="none" stroke="#8393a5" stroke-width="2"/>
<path d="M315 35V285" fill="none" stroke="#bbc7d1" stroke-width="1" stroke-dasharray="5 5"/>
<path d="M100 275L565 91.16" fill="none" stroke="#25547f" stroke-width="4" stroke-linecap="round"/>
<path d="M100 190H315" fill="none" stroke="#18817d" stroke-width="4"/>
<path d="M315 190L565 91.16" fill="none" stroke="#18817d" stroke-width="4" stroke-dasharray="8 7"/>
<circle cx="315" cy="190" r="5" fill="#146d70"/>
<text x="325" y="210" font-family="sans-serif" font-size="15" fill="#4b5d6f">K</text>
<text x="50" y="195" font-family="sans-serif" font-size="13" fill="#4b5d6f">0</text>
<text x="79" y="23" font-family="sans-serif" font-size="15" fill="#4b5d6f">만기 payoff</text>
<text x="500" y="215" font-family="sans-serif" font-size="15" fill="#4b5d6f">만기 가격 Sₜ</text>
<rect x="385" y="20" width="160" height="30" rx="5" fill="#eef3f7"/>
<path d="M397 35h25" stroke="#25547f" stroke-width="4"/><text x="430" y="40" font-family="sans-serif" font-size="14" fill="#24354b">선도 Sₜ−K</text>
<rect x="385" y="53" width="210" height="30" rx="5" fill="#e8f4f2"/>
<path d="M397 68h25" stroke="#18817d" stroke-width="4" stroke-dasharray="8 7"/><text x="430" y="73" font-family="sans-serif" font-size="14" fill="#24354b">콜 max(Sₜ−K, 0)</text>
<text x="80" y="335" font-family="sans-serif" font-size="12" fill="#687b8b">매수 1단위 · 콜 프리미엄 제외 · K 위에서는 두 선이 겹침</text>

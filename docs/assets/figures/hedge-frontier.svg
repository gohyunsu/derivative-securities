<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 355" role="img" aria-labelledby="t d">
<title id="t">선형 hedge의 평균 현금흐름과 하위 5% 현금흐름</title><desc id="d">가로축은 하위 5% 현금흐름, 세로축은 평균이며 단위는 백만 달러다. 미헤지 (197.583, 254.976), 부분헤지 (220, 252.234), 완전헤지 (248.720, 248.720)가 동일한 숫자 눈금 위의 직선에 놓인다.</desc>

<path d="M100 35V280H590" fill="none" stroke="#8495a4" stroke-width="2"/>
<path d="M153.08 82.11L511.04 241.64" fill="none" stroke="#25547f" stroke-width="4"/>
<path d="M310 152.03V280" fill="none" stroke="#c9d5da" stroke-width="1.5" stroke-dasharray="6 5"/>
<circle cx="153.08" cy="82.11" r="6" fill="#b46e29"/><circle cx="310" cy="152.03" r="6" fill="#18817d"/><circle cx="511.04" cy="241.64" r="6" fill="#25547f"/>
<text x="116" y="60" font-family="sans-serif" font-size="14" fill="#24354b">미헤지</text>
<text x="263" y="116" font-family="sans-serif" font-size="14" fill="#24354b">부분헤지</text>
<text x="495" y="212" font-family="sans-serif" font-size="14" fill="#24354b">완전헤지</text>
<path d="M153.08 280v6M310 280v6M511.04 280v6M94 81.5h6M94 209h6" fill="none" stroke="#8495a4" stroke-width="1.5"/>
<text x="153.08" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#647788">197.58</text>
<text x="310" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#18817d">220</text>
<text x="511.04" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#647788">248.72</text>

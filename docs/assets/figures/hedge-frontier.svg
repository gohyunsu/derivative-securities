<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" role="img" aria-labelledby="t d">
<title id="t">헤지 수량별 기대 현금흐름과 하위 5% 현금흐름</title><desc id="d">미헤지에서 부분헤지, 완전헤지로 가면서 기대 현금흐름은 낮아지고 하위 5% 현금흐름은 높아진다.</desc>
<rect width="660" height="350" rx="12" fill="#ffffff"/>
<path d="M90 35V280H590" fill="none" stroke="#8495a4" stroke-width="2"/>
<path d="M140 70L330 145L540 237" fill="none" stroke="#25547f" stroke-width="4"/>
<path d="M330 145V280" fill="none" stroke="#c9d5da" stroke-width="1.5" stroke-dasharray="6 5"/>
<circle cx="140" cy="70" r="6" fill="#b46e29"/><circle cx="330" cy="145" r="6" fill="#18817d"/><circle cx="540" cy="237" r="6" fill="#25547f"/>
<text x="110" y="54" font-family="sans-serif" font-size="14" fill="#24354b">미헤지</text>
<text x="270" y="127" font-family="sans-serif" font-size="14" fill="#24354b">부분헤지</text>
<text x="484" y="225" font-family="sans-serif" font-size="14" fill="#24354b">완전헤지</text>
<text x="300" y="307" font-family="sans-serif" font-size="14" fill="#4b5d6f">하위 5% 현금흐름 →</text>
<text x="22" y="168" transform="rotate(-90 22 168)" font-family="sans-serif" font-size="14" fill="#4b5d6f">평균 현금흐름 →</text>
<text x="318" y="298" font-family="sans-serif" font-size="12" fill="#18817d">220</text>
<text x="102" y="295" font-family="sans-serif" font-size="12" fill="#91a0aa">197.58</text>
<text x="514" y="295" font-family="sans-serif" font-size="12" fill="#91a0aa">248.72</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-labelledby="t d">
<title id="t">달러당 구매비용과 hedge ratio</title><desc id="d">구매비용은 (1-h)S_T+hK다. h가 0, 0.5, 0.75, 1일 때 모든 직선은 환율 S_T=K, 비용 K에서 교차하고 기울기는 각각 1, 0.5, 0.25, 0이다.</desc>
<rect width="660" height="340" rx="12" fill="#ffffff"/>
<path d="M75 35V280H595" fill="none" stroke="#7f92a3" stroke-width="2"/>
<path d="M75 165H595" fill="none" stroke="#c5d0d7" stroke-width="1" stroke-dasharray="5 5"/>
<path d="M315 35V280" fill="none" stroke="#c5d0d7" stroke-width="1" stroke-dasharray="5 5"/>
<path d="M100 251L570 63" stroke="#b46e29" stroke-width="4" fill="none"/>
<path d="M100 208L570 114" stroke="#487a9b" stroke-width="4" fill="none"/>
<path d="M100 186.5L570 139.5" stroke="#18817d" stroke-width="4" fill="none"/>
<path d="M100 165H570" stroke="#263f5e" stroke-width="4" fill="none"/>
<circle cx="315" cy="165" r="5" fill="#24354b"/>
<text x="322" y="185" font-family="sans-serif" font-size="13" fill="#5d6e7e">Sₜ=K, 비용=K</text>
<text x="90" y="25" font-family="sans-serif" font-size="14" fill="#4b5d6f">달러 1달러 구매비용 (원)</text>
<text x="458" y="313" font-family="sans-serif" font-size="14" fill="#4b5d6f">만기 원/달러 환율 Sₜ</text>
<text x="575" y="55" font-family="sans-serif" font-size="13" fill="#a36223">0% 헤지</text>
<text x="575" y="106" font-family="sans-serif" font-size="13" fill="#487a9b">50% 헤지</text>
<text x="575" y="132" font-family="sans-serif" font-size="13" fill="#18817d">75% 헤지</text>
<text x="575" y="157" font-family="sans-serif" font-size="13" fill="#263f5e">100% 헤지</text>
<text x="90" y="332" font-family="sans-serif" font-size="12" fill="#687b8b">헤지비율 h의 비용 기울기 = 1 − h</text>
</svg>
